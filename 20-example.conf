# /etc/ssh/sshd_config.d/20-example.conf

# ==============================================================================
# Global Security Hardening
# ==============================================================================
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

MaxAuthTries 3
MaxSessions 2
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2

# ==============================================================================
# Access Control (User & Subnet Restrictions)
# ==============================================================================
# Only allows user 'hoge' when connecting from the specified CIDR blocks.
# All other users and source IPs are implicitly denied.
AllowUsers hoge@10.xx.yy.0/24 hoge@172.30.zz.0/24
# Users alice and bob can login from any address, user admin can only access from 192.168.1.50
AllowUsers alice bob admin@192.168.1.50
